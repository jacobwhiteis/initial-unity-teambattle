<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Battles — Initial Unity: Reborn</title>
    <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
    <nav class="site-nav">
        <div class="nav-inner">
            <a href="/" class="nav-logo">
                <img src="/img/logo.png" alt="" class="nav-logo-img">
                <span>IU</span> Team Battles
            </a>
            <ul class="nav-links">
                <li><a href="/" class="active">Leaderboard</a></li>
                <li><a href="https://initialunityreborn.com" target="_blank">Main Site</a></li>
            </ul>
            <button class="nav-toggle" id="navToggle">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>
    <div class="nav-mobile-overlay" id="mobileMenu">
        <a href="/" class="active">Leaderboard</a>
        <a href="https://initialunityreborn.com" target="_blank">Main Site</a>
    </div>

    <main class="content-section">
        <section class="page-header">
            <h1 class="page-title">Position Leaderboard</h1>
            <p class="page-sub">Teams ranked by league position · Click a team to expand details</p>
        </section>

        <div class="board-tabs">
            <button class="board-tab active" data-board="position">Position</button>
            <button class="board-tab" data-board="crp">CRP Rankings</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead><tr>
                    <th style="width:54px">#</th>
                    <th>Team</th>
                    <th class="c">Tier</th>
                    <th class="c">W / L</th>
                    <th class="c">Streak</th>
                    <th class="r">CRP</th>
                </tr></thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>

        <section id="liveBattlesSection" class="live-battles-section" style="display: none;">
            <h2 class="section-header" style="margin-top: 48px;">Live Battles</h2>
            <div id="liveBattlesContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </section>

        <h2 class="section-header" style="margin-top: 48px;">Recent Matches</h2>

        <div id="matchesContainer" style="display: flex; flex-direction: column; gap: 10px;">
            <div class="loading-spinner"></div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">Initial Unity<span>:</span> Reborn</div>
            <div class="footer-copy">Fan-made racing game inspired by Initial D</div>
        </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
